<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Diagrama vertical de cuatro cajas unidas por flechas que bajan. De arriba abajo: Mensaje, con la nota «te pide datos o dinero, con urgencia»; Enlace, con la nota «apunta a otro sitio»; Sitio falso, con la nota «copia el aspecto del original»; y Tus datos, con la nota «la contraseña y el número de tarjeta». Entre la primera y la segunda caja, una cruz marca el punto de corte de la cadena, con la advertencia «no pulses aquí»." style="background:#1c1a17"><style>text{font:11px sans-serif;fill:#ddd}.graf-etq{font-weight:700;fill:#fff}line,path,polygon,circle{stroke:#e0a040}.graf-rejilla{stroke:#444}rect{fill:#1c1a17}polyline{fill:none;stroke:#e0a040;stroke-width:2.25;stroke-linejoin:round}</style><clipPath id="g7"><rect x="26" y="26" width="348" height="348"/></clipPath><g clip-path="url(#g7)"><polygon class="graf-fig graf-f0 graf-relleno" points="60.8,102.6 339.2,102.6 339.2,46.9 60.8,46.9"/><line class="graf-fig graf-f0" x1="200" y1="102.6" x2="200" y2="118.2"/><polygon class="graf-fig graf-f0 graf-solido" points="200,130.4 205.9,118.2 194.1,118.2"/><line class="graf-fig graf-f1" x1="187.8" y1="104.3" x2="212.2" y2="128.7"/><line class="graf-fig graf-f1" x1="187.8" y1="128.7" x2="212.2" y2="104.3"/><line class="graf-fig graf-f0 graf-punteada" x1="215.7" y1="116.5" x2="266.1" y2="116.5"/><polygon class="graf-fig graf-f0 graf-relleno" points="60.8,186.1 339.2,186.1 339.2,130.4 60.8,130.4"/><line class="graf-fig graf-f0" x1="200" y1="186.1" x2="200" y2="201.7"/><polygon class="graf-fig graf-f0 graf-solido" points="200,213.9 205.9,201.7 194.1,201.7"/><polygon class="graf-fig graf-f0 graf-relleno" points="60.8,269.6 339.2,269.6 339.2,213.9 60.8,213.9"/><line class="graf-fig graf-f0" x1="200" y1="269.6" x2="200" y2="285.3"/><polygon class="graf-fig graf-f0 graf-solido" points="200,297.4 205.9,285.3 194.1,285.3"/><polygon class="graf-fig graf-f0 graf-relleno" points="60.8,353.1 339.2,353.1 339.2,297.4 60.8,297.4"/></g><text class="graf-num graf-etq" x="200" y="78.7" text-anchor="middle">Mensaje</text><text class="graf-num graf-etq" x="200" y="94.4" text-anchor="middle">te pide datos o dinero, con urgencia</text><text class="graf-num graf-etq" x="307.9" y="120.5" text-anchor="middle">no pulses aquí</text><text class="graf-num graf-etq" x="200" y="162.2" text-anchor="middle">Enlace</text><text class="graf-num graf-etq" x="200" y="177.9" text-anchor="middle">apunta a otro sitio</text><text class="graf-num graf-etq" x="200" y="245.8" text-anchor="middle">Sitio falso</text><text class="graf-num graf-etq" x="200" y="261.4" text-anchor="middle">copia el aspecto del original</text><text class="graf-num graf-etq" x="200" y="329.3" text-anchor="middle">Tus datos</text><text class="graf-num graf-etq" x="200" y="344.9" text-anchor="middle">la contraseña y el número de tarjeta</text></svg>